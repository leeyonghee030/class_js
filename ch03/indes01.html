<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1. 전역 스코프: 어떤 중괄호에도 속하지 않는 가장 바깥 영역
      const companyName = "코딩상사";

      function printTeam() {
        //2. 함수 스코프 : 함수의 중광호 안. 에서 선언된 변수는 함수 안에서만 접근 가능하다.
        const teamName = "개발팀";

        if (true) {
          // 3. 블록 스코프 : if,for 같은 중괄호 안에서 선언된 변수는 중괄호 안에서만 접근 가능하다.
          const meetingMemo = "회의 메모";

          // 안쪽에서는 바깥 변수를 전부 읽을수 있다.
          console.log(companyName); // 코딩상사
          console.log(teamName); // 개발팀
          console.log(meetingMemo); // 블록 스코프
        } // end of if
        // console.log(meetingMemp); 함수 실행시 에러 발생. 블록 밖에서 접근 불가
      } // end of function
      console.log("함수밖");
      console.log(companyName); // 코딩상사
      // console.log(teamName); // 함수 밖에서 접근 불가. 에러 발생

      // 테스트 함수 호출
      printTeam();

      console.log("--------------------");
      const level = "전역";

      function showLevel() {
        const level = "함수";
        console.log(level); // 함수
        // 가까운것이 우선이된다 .
      }

      showLevel();
    </script>
  </body>
</html>
