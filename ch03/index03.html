<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch03 index03.html</h1>
    <script>
      console.log("----1.var의 호이스팅---");

      //선언 한적없음 오류 발생
      // console.log(abc); // undefined
      console.log(greeting); //호이스팅으로 인해 undefined 출력
      // JS 엔진이 var greeting; 선언을 맨위로 끌어올려서
      var greeting = "안녕";
      console.log(greeting); // 안녕

      console.log("----2.let, const 의 호이스팅 TDZ---");
      // let과 const 는 호이스팅이 되지만 TDZ(Temporal Dead Zone)
      // 때문에 선언 전에 접근하면 에러가 발생한다.
      // 선언줄 전까지는 사용이 금지된다  이 금지 구간을 TDZ 라고 한다.

      // console.log(welcome); // ReferenceError: Cannot access 'welcome' before initialization
      // TDZ 구간이 끝나면 정상적으로 접근 가능하다.
      const welcome = "반가워";
      console.log(welcome);

      // 함수 선언문이란: 문장의 시작에 function 이오고 이름을 붙습니다.(독립된 문장이다)
      // 즉, 함수 선언부 전체(몸까지)가 끌어 올려진다.
      // 그래서 함수를 아래에 써 놓고 위에서 호출해도 잘 동작한다.

      sayHello();
      console.log("---3. 함수선언문의 호이스팅---");
      function sayHello() {
        console.log("안녕하세요");
      }

      console.log("---4. 함수 표현식은 호이스팅 되지않는다---");
      // 함수 표현식: 값이 오는 자리에 놓은 function을 의미한다

      // sayBye(); <- 끌어올려지지않는다(함수 표현식) 오류 발생
      const sayBye = function () {
        console.log("안녕히 가세요");
      };
      sayBye();
    </script>
  </body>
</html>
