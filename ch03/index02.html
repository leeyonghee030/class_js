<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      console.log("1.블록 밖으로 새어 나온다");
      if (true) {
        var oldStyle = "var 로 만든 변수"; // var 는 블록 스코프를 무시하고 함수 스코프를 따른다.
        let newStyle = "let 으로 만든 변수"; // let 은 블록 스코프를 따른다.
      }
      console.log(oldStyle); // if 블록 밖에서도 접근 가능
      // console.log(newStyle); // ReferenceError: newStyle is not defined

      console.log("2. for 문에서 특히 주의해야 한다");
      for (var i = 0; i < 3; i++) {
        console.log(i); // 0,1,2
      }
      // 반복문 종료 후
      console.log("for 문 밖에서 i 접근:", i); // 3

      for (let j = 0; j < 3; j++) {}
      // 반복문 종료후 j 확인
      // console.log(j); // ReferenceError: j is not defined

      console.log(
        "3. 같은 이름으로 변수를 다시 선언해도 에러가 발생하지 않는다",
      );

      var userName = "홍길동";
      var userName = "김철수"; // 같은 이름으로 변수를 다시 선언해도 에러가 발생하지 않는다.
      // 실수로 다시 선언하면 에러없이 덮어쓴다
      console.log(userName); // 김철수
    </script>
  </body>
</html>
