<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      console.log("1. 함수 표현식을 화살표 함수로 ");

      const addOld = function (x, y) {
        return x + y;
      };

      const addNew = (x, y) => {
        return x + y;
      };

      const addNew2 = (x, y) => x + y;

      console.log("2. 축약 규칙에 대래서 살펴보자  ");
      // 2.1  몸체가 전체가 return 한줄이면 중괄호와 retrun  키워드 생략가능
      const subtract = (n1, n2) => n1 - n2;
      console.log(subtract(100, 10));

      // 매개 변수가 하나묜 괄호도 생략 가능하다
      const resultDouble = (n) => n * 2;

      // 2.3 매가 변수가 없으면 빈괄호만 사용하면된다

      const getRandom = () => Math.random();
      console.log(getRandom());

      // 2.4 여러줄이라면 중괄호와 return 키워드를 그대로 사용한다
      const calculateTotel = (price, count) => {
        const subtotal = price * count;
        const tax = subtotal * 0.1;
        return subtotal + tax;
      };
      console.log(calculateTotel(1000, 3));

      //3. 주의 : 객체를 한줄로 돌려줄떄는 소괄호로 감싼다.

      const makeUser = (name) => ({ name: name, active: true });
      console.log(makeUser("김국"));
    </script>
  </body>
