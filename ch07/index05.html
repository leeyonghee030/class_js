<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1. 중간에 비어있는 데이터

      const post = {
        title: "첫번쨰 글",
        witer: null, // 탈퇴한 회원이라 작성자 정보가없음
      };

      //일반적접근
      // console.log(post.witer.name); 오류 발생
      console.log("실행 결과 확인");

      // 옵셔널 체이닐 : 에러없이 undefined를 돌려주고 조용히 넘어간다
      console.log(post.witer?.name);
      post.age = 10;

      console.log("여러 단계 처리,배열, 함수에도 적용가능");
      const order = {
        id: 1001,
        customer: {
          name: "이하늘",
          address: null,
        },
        items: null,
      };

      console.log(order.customer?.name);
      console.log(order.customer?.address?.city);

      // 배열에서 쓸 떄는 ?.[]  형태 이다
      console.log(order.items?.[0]);

      // 함수 호출에 쓸떄는 ?.() 형태
      console.log(order.customer?.phone?.trim());

      console.log("실무에서는 ?. 과 ?? 를 함께 많이 사용한다");

      const writerName = post.witer?.name ?? "탈퇴한 회원";
      console.log(writerName);

      const cityName = order.customer?.address?.city ?? "주소 미입력";
      console.log(null ?? ("" || "기본값"));
    </script>
  </body>
</html>
