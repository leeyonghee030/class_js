<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch06 index01.html</h1>

    <script>
      console.log("---1. 메서드로 호출하면 this는 점 앞에 객체이다---");

      const cat = {
        name: "나비",
        name2: "나비2",
        introduce: function () {
          console.log("제 이름은 " + this.name2 + " 입니다.");
        },
      };

      cat.introduce(); // 점 앞에 있는 cat이 this이다

      const dog = {
        name: "초코",

        introduce: cat.introduce,
      };
      dog.introduce();

      // 그냥 호출하면 this는 window이다.
      const alone = cat.introduce; // 함수 호출이 아닌 변수에 할당

      alone(); // 실제 함수에 동작은 cat의 this.name이라서  <-- this(window)
      // 주의  window.name 속성은 특수한 변수라서 미리 선점되어있다 .

      let name = "구구";
      //4. new로 호출하면 this는 새로 만들어지는 객체를 가리킨다
      function Member(name) {
        this.name = name;
      }

      const member1 = new Member("임창");
      console.log(member1.name);

      const member2 = Member("이순신");
      console.log(member2);
      console.log(window.name);
      // new를 빠뜨리면  점이 없는 호출이되어진다 즉 window.name(this = window)
      window.name = "";
      // 새로고침을 해도 값이 남는 특수한 속성이 있다. 혹시 다른 코드에 영향을
      // 줄 수 있기 때문에 초기화 처리 한다.
      console.log(window.name);
    </script>
  </body>
</html>
