<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 index03.html 파일</h1>

    <script>
      console.log("1. 배열 만들기와 인덱스");
      const furits = ["사과", "바나나", "포도"];

      console.log(furits);
      console.log(furits[0]);
      console.log(furits[1]);
      console.log(furits[2]);
      console.log(furits[3]); // 없는 인덱스 번호 undefined
      console.log(furits.length); // 3

      // 항상 마지막 인덱스 값을 출력할떄
      console.log(furits[furits.length - 1]);

      // JS 배열에 값 추가와 제거
      furits.push("딸기"); // 요소의 맨 뒤에 추가
      console.log(furits);

      furits.pop();
      console.log(furits); //  요소 맨 뒤 삭제

      furits[1] = "블루베리";
      console.log(furits);

      // 반복문으로 활용하기

      // 방법 1 인덱스를 활용 할떄 사용하는 for 문
      for (let i = 0; i < furits.length; i++) {
        console.log(i + 1 + " 번째 과일  " + furits[i]);
      }

      // 방법 2 for of 값만 필요할떄 사용한다.
      for (const f of furits) {
        console.log(f);
      }

      // 객체와 배열 : 서버 데이터의 기본 형태
      const studentList = [
        { name: "홍길동", age: 20, magor: "컴퓨터공학" },
        { name: "이순신", age: 21, major: "경영" },
      ];

      // 반복문 돌면서 해당 객체의 이름과 나이를 출력하시오 전체
      for (const f of studentList) {
        if (f.age >= 21) {
          console.log("이름 : " + f.name + ", 나이 : " + +f.age);
        }
      }

      for (let i = 0; i < studentList.length; i++) {
        console.log(
          i +
            1 +
            " 번쨰 학생 이름 : " +
            studentList[i].name +
            " 나이 : " +
            studentList[i].age,
        );
      }
    </script>
  </body>
</html>
