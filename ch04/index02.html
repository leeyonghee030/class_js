<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 index02.html</h1>

    <script>
      // 1. 중첩 객체
      const member = {
        firstName: "길동",
        lastName: "홍",
        age: 30,

        //값 자리에 객체를 넣을수잇다 (중첩 객체)
        address: {
          street: "부산시 진구 50번길",
          city: "부산",
          zip: "456789",
        },

        // 2. 값 자리에 배열을 넣을수있다
        hobbies: ["독서", "등산", "요리", "코딩"],

        // 3. 값 자리에 함수를 넣을수 있다. 이것을 메서드라고 부를수있다
        //참고 this는 "이객체 자신을 가르킨다"
        introduce: function () {
          console.log("제 이름은" + this.lastName + this.firstName + " 입니다");
        },
      };

      console.log("중첩된 값 꺼내기");
      console.log(member);
      console.log(member.address.city);
      console.log(member.hobbies[1]);

      // 메서드 호출
      member.introduce(); // 주의 메서드 호출시 반드시 괄호를 사용해야한다
      // console.log(member.introduce); // 괄호없이 출력을한다면 함수자체가 나옴

      // 없는 키에 값을 넣으면 그게 속성이된다 (세로 생김 )
      member.email = "a@a.a";
      console.log(member.email);

      // 메서드 속성에 값 수정
      member.age = 31;
      console.log(member.age);

      // 속성 삭제
      delete member.zip; // 없는 키를 지워도 에러는 없다
      delete member.email;

      console.log(member.email); //undefined
      console.log(member); // 전체 확인

      // 9번
      member.firstName = "티모";
      console.log(member.firstName);
      // member 객체 리터럴을 const로 선언했지만 안에 속성 값은 변경이된다
      // memebe 앞에 const는 새로운 객체로 수정 못하게 막는것이지 안에 속겅과 갑은 상관없다
      // member = { firstName: "순신" };  에러 새로운 객체를 대입하는것은 값에 변경이다
    </script>
  </body>
</html>
