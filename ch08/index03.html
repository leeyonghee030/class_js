<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="product-list"></div>

    <script>
      const numbers = [1, 2, 3, 4, 5];
      const evens = numbers.filter((n) => {
        return n % 2 === 0;
      });
      console.log(evens);

      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식 키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터 받침대", price: 15000, stock: 12 },
      ];
      const isStock = products.filter((p) => p.stock > 0);
      console.log(isStock);

      // 조건을 여러개 걸기
      const cheapMouse = products.filter((p) => p.stock > 0 && p.price > 20000);
      console.log(cheapMouse);

      //filter와 map 이어쓰기
      const cardList = products
        .filter((p) => p.stock > 0)
        .map((p) => {
          return `
          <div class="card">
            <h3>${p.name}</h3>
            <p>${p.price.toLocaleString()}원</p>
            <p>${p.stock}</p>
            </div>
        `;
        });

      console.log(cardList);

      document.getElementById("product-list").innerHTML = cardList.join("");
    </script>
  </body>
</html>
