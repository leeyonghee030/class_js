<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식 키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터 받침대", price: 15000, stock: 12 },
      ];

      for (let i = 0; i < products.length; i++) {
        console.log(products[i].name);
      }
      // 1. for each 는 안에서 콜백을 부를떄 항상 (요소,인덱스,배열 )
      // 매개변구를 하나 적으묜 요소만 받고 주개를 적음ㄴ 인덱스까지, 3개면 배열까지

      products.forEach((p) => {
        console.log(`${p.name}`);
      });

      // for each에 2번쨰 매개변수는 인데스 이다
      products.forEach((p, index) => {
        console.log(`${index} ${p.name}`);
      });

      // 4. forEach 는 돌려주는 값이 없
      const result = products.forEach((p) => p.name);
      console.log(result);

      // 합계구하기
      let totalStock = 0;

      products.forEach((p) => {
        totalStock += p.stock;
      });
      console.log(totalStock);

      //  products 안에 price의 전체 합계금액
      let totalPrice = 0;
      products.forEach((p) => {
        totalPrice += p.price;
      });
      console.log(totalPrice);
    </script>
  </body>
</html>
