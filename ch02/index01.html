<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch02- index01.html 파일</h1>
    
    <script>
        // 1. let 변경이 가능한 값을 담는 상자 
        let username ="홍길동";
        console.log(username);
        username = "티모";
        console.log(username); // 상자안에 값을 바꿀수있다 .

        // 2. const 한번 정하면 변경이 불가능한 값을 담는 상자
        const PI = 3.14;
        console.log(PI);
        
        //3. const 상자안에 값을 바꾸려고 하면 에러가 발생한다.
        // PI = 3.14159; // 에러 발생
        // 플러그인에서 에러 발생 안함

        // 4. 한페이지 안에 같은 변수를 선언한다면?
        // let username = "이순신"; // 에러 발생

        // 5. 
        let anyting = 100; // 이시점에는 number 타입 
        anyting = "문자열"; // 이시점에는 string 타입
        console.log(anyting);
    </script>
</body>
</html>
